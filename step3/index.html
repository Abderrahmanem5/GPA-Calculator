<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GPA Calculator Step 3 – AJAX client-side calculation with jQuery and Bootstrap.">
  <title>GPA Calculator – Step 3</title>
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- jQuery then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container gpa-container">

    <div class="gpa-header text-center mb-4">
      <h1>GPA Calculator</h1>
      <p class="text-muted">jQuery powered – no page reload needed</p>
    </div>

    <!-- Result area -->
    <div id="result" class="mb-3"></div>

    <div class="card gpa-card shadow-sm mb-4">
      <div class="card-body">
        <form id="gpaForm">
          <div id="courses">
            <div class="course-row form-row mb-2 align-items-end">
              <div class="col">
                <label class="field-label">Course Name</label>
                <input type="text" name="course[]" class="form-control gpa-input"
                       placeholder="e.g. Mathematics" required>
              </div>
              <div class="col-3">
                <label class="field-label">Credits</label>
                <input type="number" name="credits[]" class="form-control gpa-input"
                       placeholder="3" min="1" max="10" required>
              </div>
              <div class="col-2">
                <label class="field-label">Grade</label>
                <select name="grade[]" class="form-control gpa-input">
                  <option value="4.0">A</option>
                  <option value="3.0">B</option>
                  <option value="2.0">C</option>
                  <option value="1.0">D</option>
                  <option value="0.0">F</option>
                </select>
              </div>
            </div>
          </div>

          <div class="gpa-actions mt-3">
            <button type="button" id="addCourse" class="btn btn-outline-secondary">
              + Add Course
            </button>
            <button type="submit" class="btn btn-primary gpa-submit">
              Calculate GPA
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
