<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple GPA Calculator – enter your courses, credits, and grades to compute your GPA.">
  <title>GPA Calculator – Step 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- script loaded AFTER DOM via defer -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <header class="page-header">
      <h1>GPA Calculator</h1>
      <p class="subtitle">Enter your courses to compute your Grade Point Average</p>
    </header>

    <main class="card">
      <form action="calculate.php" method="post" onsubmit="return validateForm();">
        <div id="courses">
          <div class="course-row">
            <div class="field">
              <label>Course Name</label>
              <input type="text" name="course[]" placeholder="e.g. Mathematics" required>
            </div>
            <div class="field field--sm">
              <label>Credits</label>
              <input type="number" name="credits[]" placeholder="3" min="1" max="10" required>
            </div>
            <div class="field field--sm">
              <label>Grade</label>
              <select name="grade[]">
                <option value="4.0">A</option>
                <option value="3.0">B</option>
                <option value="2.0">C</option>
                <option value="1.0">D</option>
                <option value="0.0">F</option>
              </select>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--secondary" onclick="addCourse()">+ Add Course</button>
          <button type="submit" class="btn btn--primary">Calculate GPA</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
